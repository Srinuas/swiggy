---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiggy-food-deployment
  namespace: srinu
  labels:
    app: swiggy-food
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swiggy-food
  template:
    metadata:
      labels:
        app: swiggy-food
    spec:
      containers:
      - name: food-container
        image: srinuas/swiggy:instamart
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
